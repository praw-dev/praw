jobs:
  prepare_release:
    name: Prepare Release
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    uses: praw-dev/.github/.github/workflows/prepare_release.yml@34032c07a7e2f432e0bb13ff126ed667d96e2528 # v1.8.0
    with:
      package: praw
      version: ${{ inputs.version }}
      version_file: const.py
name: Prepare Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to prepare for release
        required: true
permissions:
  contents: read
